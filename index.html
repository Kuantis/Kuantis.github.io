<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuantis · Apps</title>
  <meta name="description" content="Apps de Kuantis: DeskFlow y Unwindy.">
  <style>
    :root { --bg: #ffffff; --fg: #18181b; --muted: #52525b; --card: #f4f4f5; --accent: #1868c4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --fg: #f4f4f5; --muted: #a1a1aa; --card: #18181b; --accent: #5aa9ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 1.9rem; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 32px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    a.card { display: block; padding: 18px 20px; border-radius: 16px; background: var(--card); color: var(--fg); text-decoration: none; }
    a.card:hover, a.card:focus-visible { outline: 2px solid var(--accent); }
    a.card strong { display: block; font-size: 1.1rem; }
    a.card span { color: var(--muted); }
    footer { margin-top: 40px; color: var(--muted); font-size: .9rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Kuantis</h1>
    <p>Apps para el día a día. · Apps for everyday life.</p>
    <ul>
      <li><a class="card" href="/deskflow/"><strong>DeskFlow</strong><span>Salud en la oficina · Healthy workday</span></a></li>
      <li><a class="card" href="/unwindy/"><strong>Unwindy</strong><span>Descanso y sueño · Rest &amp; sleep</span></a></li>
    </ul>
    <footer>Contacto · Contact: <a href="mailto:kuantis.dev@gmail.com">kuantis.dev@gmail.com</a></footer>
  </main>
</body>
</html>
